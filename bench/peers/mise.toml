# The peer toolchains (#192). Optional: they live here, not in the root mise.toml, so a
# plain `mise install` at the repo root does not download them; `mise run bench:peers`
# installs them on first use. C and Swift use the Xcode toolchain (cc, swiftc), whose
# versions peers.json records.
[tools]
go = "1.27.3"
rust = "1.99.1"
node = "26.13.0"
python = "3.15.2"
