name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # The newest run deploys Pages too, so an older main run is safe to cancel.
  cancel-in-progress: true

# The backend emits arm64 macOS Mach-O executables and ad-hoc code-signs them;
# the run/emit tests SkipZigTest on anything but macos+aarch64. Every job therefore
# runs on an Apple-Silicon macOS runner, or the whole backend would silently no-op.
# Tools come from mise (pinned in mise.toml).
jobs:
  # A push that only records bench history needs the site rebuilt, not the Zig suite.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      gc: ${{ steps.diff.outputs.gc }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          gc=true
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -vxF 'bench/history.jsonl' | grep -q .; then
              code=false
            fi
            # The GC stress corpus is slow, so a PR runs it only when it touches what
            # roots, layouts or the collector come from: codegen (the runtime and GC
            # included), lowering, the IR and the passes that change what is live across
            # a call, the query engine and profiles that pick the build, the linker's
            # stack maps, core, or the job itself.
            if [ "$EVENT" = pull_request ] && ! printf '%s\n' "$files" | grep -qE '^(packages/compiler/src/(codegen/|lower/|lower\.zig|ir/|opt/|query/|driver/|link/)|packages/lib/core/|packages/compiler/tests/corpus\.zig|\.github/workflows/ci\.yml)'; then
              gc=false
            fi
          fi
          [ "$code" = true ] || gc=false
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "gc=$gc" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Zig tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: add ubuntu-latest and windows-latest once the backend targets Linux/Windows.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-test-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**/*.zig', 'packages/lib/**/*.toy') }}
          restore-keys: zig-cache-test-${{ runner.os }}-
      # Unit, cli, lsp, integration and corpus suites. The integration tests drive the toy
      # this step builds and installs; the corpus harness builds every tests/corpora fixture
      # in --verify mode, so it is also the determinism gate.
      - name: Tests
        run: zig build test --summary all

  gates:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Cache and opt gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: add ubuntu-latest and windows-latest once the backend targets Linux/Windows.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-gates-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**/*.zig', 'packages/lib/**/*.toy') }}
          restore-keys: zig-cache-gates-${{ runner.os }}-
      # Edit scenarios across separate toy runs sharing one on-disk cache: a warm rebuild
      # must match a cold build's __text and recompile less than a full build.
      - name: Incremental cache soundness
        run: bash tests/corpora/language-features/incremental.sh
      # -O0 against -O1 over the corpus (exit code and stdout), and each opt pass's win.
      - name: Opt-level differential
        run: bash bench/opt-check.sh
      # When `mise run bench` appends to bench/history.jsonl, on a scratch repo.
      - name: Bench history rules
        run: bash bench/record-test.sh

  gc-stress:
    needs: changes
    if: needs.changes.outputs.gc == 'true'
    name: GC stress corpus (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: add ubuntu-latest and windows-latest once the backend targets Linux/Windows.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-gc-stress-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**/*.zig', 'packages/lib/**/*.toy') }}
          restore-keys: zig-cache-gc-stress-${{ runner.os }}-
      # Every corpus program built with --gc-stress (a collection before each allocation)
      # at -O0 and -O1 must still meet its # expect: lines.
      - name: GC stress corpus
        run: mise run test:gc-stress

  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Bounded fuzz (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: add ubuntu-latest and windows-latest once the backend targets Linux/Windows.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-fuzz-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**/*.zig', 'packages/lib/**/*.toy') }}
          restore-keys: zig-cache-fuzz-${{ runner.os }}-
      # Seeded + bounded (FUZZ_SEED / FUZZ_ITERS / FUZZ_DIFF_ITERS), so the run terminates
      # in a few minutes and reproducibly. Forced to Debug by build.zig so the parser
      # invariants fire. The differential phase builds each program at every level, with
      # and without GC stress.
      - name: Front-end and differential fuzzer
        run: zig build fuzz
        env:
          FUZZ_SEED: "1"
          FUZZ_ITERS: "5000"
          FUZZ_DIFF_ITERS: "200"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: fmt + release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: add ubuntu-latest and windows-latest once the backend targets Linux/Windows.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-lint-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**/*.zig', 'packages/lib/**/*.toy') }}
          restore-keys: zig-cache-lint-${{ runner.os }}-
      - name: Format check
        run: zig fmt --check packages build.zig build.zig.zon
      - name: Release build
        run: zig build -Doptimize=ReleaseFast

  site:
    name: Docs site (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: add ubuntu-latest and windows-latest once the backend targets Linux/Windows.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/site
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: .zig-cache
          key: zig-cache-site-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'packages/**/*.zig', 'packages/lib/**/*.toy') }}
          restore-keys: zig-cache-site-${{ runner.os }}-
      # Run once here; the site:test / site:e2e tasks would each rebuild it.
      - name: Build wasm language server
        run: mise run site:wasm
      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Install Chromium
        run: pnpm exec playwright install chromium
      - name: End-to-end tests
        run: pnpm e2e
      # After e2e: its preview build has no base path and would overwrite this one.
      - name: Build for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/build

  pages:
    name: Deploy docs site
    # Skipped Zig jobs (a history-only push) must not block the deploy; failed ones must.
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [changes, test, gates, gc-stress, fuzz, lint, site]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
